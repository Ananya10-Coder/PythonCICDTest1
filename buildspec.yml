
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo Installing dependencies...
      - pip install -r requirements-dev.txt

  pre_build:
    commands:
      - echo Starting tests...

  build:
    commands:
      - echo Running Python tests...
      - pytest -v

  post_build:
    commands:
      - echo Build completed successfully!

artifacts:
  files:
    - application.py
    - requirements.txt
    - README.md
